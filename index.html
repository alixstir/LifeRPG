<style>
/* Concept : carnet d'aventurier de nuit. Un seul écran à la fois, barre d'onglets en bas, le niveau en gros chiffre comme repère. */
:root{
  --bg:#EDEFF7; --surface:#FFFFFF; --surface-2:#E3E6F3; --ink:#181B3A; --muted:#565B82; --line:#D3D7EA;
  --xp:#4F3FD8; --xp-soft:#E4E0FB; --gold:#8F5E05; --gold-soft:#F7E9C6; --coin:#D9962B; --ok:#1B7F54; --danger:#B83325; --on-xp:#FFFFFF;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Avenir Next','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1126; --surface:#181B3A; --surface-2:#22264D; --ink:#ECEEFB; --muted:#9BA1CE; --line:#2E3366;
  --xp:#9186FF; --xp-soft:#2A2766; --gold:#EDBB55; --gold-soft:#3A2F14; --coin:#E8B64A; --ok:#4CCB8F; --danger:#FF8272; --on-xp:#0F1126; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1126; --surface:#181B3A; --surface-2:#22264D; --ink:#ECEEFB; --muted:#9BA1CE; --line:#2E3366;
  --xp:#9186FF; --xp-soft:#2A2766; --gold:#EDBB55; --gold-soft:#3A2F14; --coin:#E8B64A; --ok:#4CCB8F; --danger:#FF8272; --on-xp:#0F1126; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--xp);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.coin{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--coin);box-shadow:inset 0 0 0 .14em color-mix(in srgb,var(--coin) 60%,#000 25%);vertical-align:-.05em}

/* en-tête */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:4px}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.top .date{font-size:14px;color:var(--muted)}
.demo{font-size:12px;font-weight:600;background:var(--gold-soft);color:var(--gold);border-radius:99px;padding:4px 10px;white-space:nowrap}

/* carte héros */
.hero{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end}
:root[data-theme="dark"] .hero{background:var(--surface-2);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:var(--surface-2);color:var(--ink)}}
.hero .lvl{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.04em}
.hero .lvl small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--body);font-weight:700;opacity:.75;margin-bottom:6px}
.hero .meta{display:flex;flex-direction:column;gap:8px;min-width:0}
.hero .line{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.bar{height:10px;border-radius:99px;background:color-mix(in srgb,currentColor 22%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:#B9B1FF;min-width:4px;transition:width .5s}
.hero .bar i{background:#FFD36B}
.card .bar{background:var(--xp-soft)}.card .bar i{background:var(--xp)}
.hero .foot{grid-column:1/-1;display:flex;justify-content:space-between;font-size:13px;opacity:.85;margin-top:8px}

/* listes */
.section{display:flex;flex-direction:column;gap:10px}
.section h2{font-size:18px;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px}
.item .ico{font-size:22px;width:30px;text-align:center;flex:none}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--xp-soft);color:var(--xp);white-space:nowrap}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--xp);display:grid;place-items:center;color:transparent;background:transparent}
.quest.done{background:transparent;border-style:dashed}
.quest.done .t{color:var(--muted);text-decoration:line-through}
.quest.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.quest:active:not(.done),.item:active{transform:scale(.99)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}

/* journal */
.day-h{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 2px 0}
.del{border:0;background:transparent;color:var(--muted);font-size:13px;padding:8px;min-width:44px;min-height:44px;border-radius:10px}
.del.confirm{background:var(--danger);color:#fff;font-weight:700}

/* stats */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.statrow{display:grid;grid-template-columns:30px 1fr auto;gap:2px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.statrow:first-child{border-top:0}
.statrow .bar{grid-column:2/4;height:8px}
.statrow .n{font-weight:600}
.radar{display:block;width:100%;max-width:320px;margin:0 auto;height:auto}
.radar text{fill:var(--muted);font-family:var(--body)}

/* guilde */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-weight:600;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.rank{font-family:var(--display);font-weight:800;font-size:20px;width:28px;text-align:center;color:var(--muted)}
.me{border-color:var(--xp);background:var(--xp-soft)}

/* boutons */
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;background:var(--xp);color:var(--on-xp);min-height:48px;width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.danger.confirm{background:var(--danger);color:#fff}
.btn:disabled{opacity:.55}

/* formulaires */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tog{display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px}
.tog input{width:22px;height:22px;accent-color:var(--xp)}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:26px;line-height:1}
.stepper output{font-family:var(--display);font-weight:800;font-size:40px;min-width:60px;text-align:center}
.reward{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* feuille */
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.55);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:22px 22px 0 0;max-height:90%;overflow-y:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:22px;font-weight:800}

/* barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{display:flex;width:100%;max-width:560px}
.tab{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:52px;color:var(--muted);font-size:11px;font-weight:600;border-radius:12px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--xp)}
.tab[aria-current="page"] svg{stroke-width:2.3}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast b{color:#FFD36B}
:root[data-theme="dark"] .toast{background:var(--ink);color:var(--bg)}

/* auth */
.auth{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:16px;width:100%}
.auth h1{font-size:40px;font-weight:800;letter-spacing:-.03em}
.err{color:var(--danger);font-weight:600;font-size:14px}
.ok-msg{color:var(--ok);font-weight:600;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ===== RÉGLAGES : colle ici les deux valeurs de ton projet Supabase (voir le guide) ===== */
const CONFIG = { SUPABASE_URL: "https://ojxpfchmptlijvkkltzs.supabase.co", SUPABASE_ANON_KEY: "sb_publishable_AubvQcHVBLSKl2_wlUrEZA_Mz-lU9mf" };

/* ===== Règles du jeu (reprises de ton Google Sheet) ===== */
const STATS = [
  {n:'Force',i:'⚔️'},{n:'Intelligence',i:'🧠'},{n:'Discipline',i:'✅'},
  {n:'Créativité',i:'🖍️'},{n:'Charisme',i:'👑'},{n:'Sagesse',i:'🧘'}
];
const STREAK_CAP = 30;              // bonus de série : +1 XP par jour d'affilée, plafonné
const lvl = xp => Math.floor(Math.pow(Math.max(xp,0)/100, 1/1.8));
const minXp = n => n<=0 ? 0 : Math.ceil(100*Math.pow(n,1.8));
const DEFAULT_ACTIVITIES = [
  ['Cardio (20 min)','Force',40,5,'Fitness',30,0],['Crochet (1 heure)','Créativité',20,3,'Crochet',20,0],
  ['Jeux de plateau','Intelligence',15,1,'Jeux',15,0],['Jeux Vidéo (1 heure)',null,10,0,'Jeux',0,0],
  ['Lire 30 pages','Intelligence',25,2,'Lecture',20,1],['Méditation (5 min)','Sagesse',10,1,'Méditation',10,0],
  ['Ménage (10 min)','Discipline',20,2,'Organisation',20,0],['Mots Fléchés','Intelligence',15,1,'Jeux',10,0],
  ['Recherches (1 heure)','Intelligence',50,5,'Apprentissage',40,0],['Sortie','Charisme',50,7,'Sociabilité',50,0],
  ['Tricot (1 heure)','Créativité',20,3,'Tricot',10,0],['Marche (5000 pas)','Force',20,5,'Marche',20,0],
  ['Piano (30 min)','Créativité',30,5,'Piano',20,1],['Boire deux litres d\'eau',null,5,1,'',0,1]
].map(a=>({name:a[0],stat:a[1],xp:a[2],gold:a[3],skill:a[4],stat_xp:a[5],daily:!!a[6],active:true}));
const SEED_HISTORY = [{"day": "2026-09-26", "activity": "Piano (30 min)", "qty": 1, "xp": 30, "gold": 5, "bonus_xp": 0, "skill": "Piano", "stat": "Créativité", "stat_xp": 20}, {"day": "2026-09-26", "activity": "Piano (30 min)", "qty": 1, "xp": 30, "gold": 5, "bonus_xp": 0, "skill": "Piano", "stat": "Créativité", "stat_xp": 20}, {"day": "2026-09-28", "activity": "Tricot (1 heure)", "qty": 2, "xp": 40, "gold": 6, "bonus_xp": 0, "skill": "Tricot", "stat": "Créativité", "stat_xp": 20}, {"day": "2026-09-29", "activity": "Jeux Vidéo (1 heure)", "qty": 3, "xp": 30, "gold": 0, "bonus_xp": 0, "skill": "Jeux", "stat": null, "stat_xp": 0}, {"day": "2026-09-29", "activity": "Ménage (10 min)", "qty": 2, "xp": 40, "gold": 4, "bonus_xp": 0, "skill": "Organisation", "stat": "Discipline", "stat_xp": 40}, {"day": "2026-09-30", "activity": "Piano (30 min)", "qty": 2, "xp": 60, "gold": 10, "bonus_xp": 0, "skill": "Piano", "stat": "Créativité", "stat_xp": 40}, {"day": "2026-10-02", "activity": "Mots Fléchés", "qty": 2, "xp": 30, "gold": 2, "bonus_xp": 0, "skill": "Jeux", "stat": "Intelligence", "stat_xp": 20}, {"day": "2026-10-05", "activity": "Lire 30 pages", "qty": 1, "xp": 25, "gold": 2, "bonus_xp": 0, "skill": "Lecture", "stat": "Intelligence", "stat_xp": 20}, {"day": "2026-10-05", "activity": "Boire deux litres d'eau", "qty": 1, "xp": 5, "gold": 1, "bonus_xp": 0, "skill": null, "stat": null, "stat_xp": 0}, {"day": "2026-10-21", "activity": "Boire deux litres d'eau", "qty": 1, "xp": 5, "gold": 1, "bonus_xp": 0, "skill": null, "stat": null, "stat_xp": 0}, {"day": "2026-11-04", "activity": "Marche (5000 pas)", "qty": 2, "xp": 40, "gold": 10, "bonus_xp": 0, "skill": "Marche", "stat": "Force", "stat_xp": 40}, {"day": "2026-10-21", "activity": "Lire 30 pages", "qty": 1, "xp": 25, "gold": 2, "bonus_xp": 0, "skill": "Lecture", "stat": "Intelligence", "stat_xp": 20}, {"day": "2026-10-21", "activity": "Piano (30 min)", "qty": 1, "xp": 30, "gold": 5, "bonus_xp": 0, "skill": "Piano", "stat": "Créativité", "stat_xp": 20}, {"day": "2026-11-04", "activity": "Lire 30 pages", "qty": 2, "xp": 50, "gold": 4, "bonus_xp": 0, "skill": "Lecture", "stat": "Intelligence", "stat_xp": 40}];

/* ===== Utilitaires ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const today = () => new Date().toLocaleDateString('en-CA');
const addDays = (d,n) => { const x=new Date(d+'T12:00:00'); x.setDate(x.getDate()+n); return x.toLocaleDateString('en-CA'); };
const statIcon = n => (STATS.find(s=>s.n===n)||{i:'✨'}).i;
const fmtDay = d => { if(d===today())return "Aujourd'hui"; if(d===addDays(today(),-1))return 'Hier';
  return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}); };

/* ===== État ===== */
const S = { cloud:false, user:null, activities:[], journal:[], board:[], tab:'today', boardMode:'week',
  sheet:null, auth:{mode:'in',err:'',info:'',busy:false}, confirmDel:null, loading:true };
let sb = null;

/* ===== Stockage : local (démo) ou Supabase ===== */
const Store = {
  async addEntry(e){
    const {data,error}=await sb.from('journal').insert(e).select().single(); if(error) throw error; S.journal.push(data); return data;
  },
  async delEntry(id){
    const {error}=await sb.from('journal').delete().eq('id',id); if(error) throw error;
    S.journal=S.journal.filter(e=>e.id!==id);
  },
  async saveActivity(a){
    const row={name:a.name,stat:a.stat,xp:a.xp,gold:a.gold,skill:a.skill,stat_xp:a.stat_xp,daily:a.daily,active:a.active};
    if(a.id){ const {error}=await sb.from('activities').update(row).eq('id',a.id); if(error) throw error; S.activities=S.activities.map(x=>x.id===a.id?{...a}:x); }
    else { const {data,error}=await sb.from('activities').insert(row).select().single(); if(error) throw error; S.activities.push(data); }
  },
  async delActivity(id){
    const {error}=await sb.from('activities').delete().eq('id',id); if(error) throw error;
    S.activities=S.activities.filter(x=>x.id!==id);
  },
  async importHistory(){
    const {data,error}=await sb.from('journal').insert(SEED_HISTORY.map(e=>({...e}))).select(); if(error) throw error;
    S.journal.push(...data);
  },

  /* --- cloud --- */
  async fetchAll(table){
    let out=[],from=0; for(;;){ const {data,error}=await sb.from(table).select('*').order('created_at').range(from,from+999);
      if(error) throw error; out=out.concat(data); if(data.length<1000) break; from+=1000; } return out;
  },
  async loadCloud(){
    const {data:{session}}=await sb.auth.getSession();
    if(!session){ S.user=null; return; }
    const u=session.user;
    let {data:prof}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
    if(!prof){ const name=(u.user_metadata&&u.user_metadata.name)||(u.email||'Joueur').split('@')[0];
      const r=await sb.from('profiles').insert({id:u.id,name}).select().single(); if(r.error) throw r.error; prof=r.data; }
    S.user={id:u.id,name:prof.name};
    let acts=await this.fetchAll('activities');
    if(!acts.length){ const r=await sb.from('activities').insert(DEFAULT_ACTIVITIES.map(a=>({...a}))).select(); if(r.error) throw r.error; acts=r.data; }
    S.activities=acts; S.journal=await this.fetchAll('journal');
    await this.loadBoard();
  },
  async loadBoard(){ const {data}=await sb.from('leaderboard').select('*'); S.board=data||[]; }
};

/* ===== Calculs ===== */
function totals(){
  let xp=0,gold=0; const st={}; STATS.forEach(s=>st[s.n]=0);
  for(const e of S.journal){ xp+=(e.xp||0)+(e.bonus_xp||0); gold+=e.gold||0; if(e.stat in st) st[e.stat]+=e.stat_xp||0; }
  return {xp,gold,st};
}
function lvlInfo(xp){ const l=lvl(xp), min=minXp(l), next=minXp(l+1); return {l,min,next,pct:Math.min(1,Math.max(0,(xp-min)/(next-min)))}; }
function streak(name){
  const days=new Set(S.journal.filter(e=>e.activity===name).map(e=>e.day));
  let d=today(); if(!days.has(d)) d=addDays(d,-1);
  let n=0; while(days.has(d)){ n++; d=addDays(d,-1); } return n;
}
const doneToday = a => S.journal.some(e=>e.day===today()&&e.activity===a.name);
function buildEntry(a,qty,day){
  const e={day,activity:a.name,qty,xp:a.xp*qty,gold:a.gold*qty,bonus_xp:0,skill:a.skill||null,stat:a.stat||null,stat_xp:(a.stat_xp||0)*qty};
  if(a.daily) e.bonus_xp=Math.min(streak(a.name)+1,STREAK_CAP);
  return e;
}
async function logActivity(a,qty,day){
  const before=totals(); const e=buildEntry(a,qty,day);
  try{ await Store.addEntry(e); }catch(err){ toast('Erreur : '+(err.message||err)); return; }
  const after=totals(); const parts=[`<b>+${e.xp+e.bonus_xp} XP</b>`]; if(e.gold) parts.push(`<b>+${e.gold} or</b>`);
  if(e.bonus_xp>1) parts.push(`série ${e.bonus_xp} j`);
  let msg=parts.join(' · ');
  if(lvl(after.xp)>lvl(before.xp)) msg=`Niveau ${lvl(after.xp)} atteint ! `+msg;
  else if(e.stat && lvl(after.st[e.stat])>lvl(before.st[e.stat])) msg=`${esc(e.stat)} niveau ${lvl(after.st[e.stat])} ! `+msg;
  toast(msg); if(S.cloud) Store.loadBoard().then(render).catch(()=>{}); render();
}
let toastT=null;
function toast(html){ const h=$('#toast-host'); h.innerHTML=`<div class="toast" role="status">${html}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>h.innerHTML='',3200); }

/* ===== Vues ===== */
const ICONS={
  today:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16.5 9.5"/>',
  journal:'<path d="M6 4h10a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2z"/><path d="M9 9h6M9 13h6"/>',
  hero:'<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/>',
  guild:'<circle cx="9" cy="9" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3.5 19c.5-3 3-5 5.5-5s5 2 5.5 5M15 15c3 0 5 1.5 5.5 4"/>',
  acts:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'
};
const TABS=[['today','Aujourd\'hui'],['journal','Journal'],['hero','Héros'],['guild','Joueurs'],['acts','Activités']];

function viewToday(){
  const t=totals(), L=lvlInfo(t.xp);
  const todayXp=S.journal.filter(e=>e.day===today()).reduce((s,e)=>s+e.xp+e.bonus_xp,0);
  const quests=S.activities.filter(a=>a.active&&a.daily);
  const others=S.activities.filter(a=>a.active&&!a.daily);
  const doneN=quests.filter(doneToday).length;
  return `
  <header class="top"><div><h1>Salut ${esc(S.user.name)}</h1><div class="date">${(d=>d[0].toUpperCase()+d.slice(1))(new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}))}</div></div></header>
  <section class="hero" aria-label="Progression">
    <div class="lvl num"><small>Niveau</small>${L.l}</div>
    <div class="meta"><div class="line num"><span>${t.xp-L.min} / ${L.next-L.min} XP</span><span><span class="coin"></span> ${t.gold} or</span></div>
    <div class="bar" role="progressbar" aria-valuenow="${Math.round(L.pct*100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${L.pct*100}%"></i></div></div>
    <div class="foot num"><span>Aujourd'hui : +${todayXp} XP</span><span>Prochain niveau à ${L.next} XP</span></div>
  </section>
  <section class="section"><div class="row"><h2 class="grow">Quêtes du jour</h2><span class="pill num">${doneN}/${quests.length}</span></div>
    <div class="list">${quests.length?quests.map(a=>{const d=doneToday(a),s=streak(a.name);
      return `<button class="item quest ${d?'done':''}" data-act="quest" data-id="${a.id}" ${d?'aria-disabled="true"':''}>
        <span class="check" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        <span class="grow"><span class="t">${esc(a.name)}</span><br><span class="s num">+${a.xp} XP${a.gold?` · +${a.gold} or`:''}${s?` · série ${s} j`:''}</span></span>
        ${d?'<span class="pill">Fait</span>':`<span class="pill gold num">+${Math.min(s+1,STREAK_CAP)} bonus</span>`}</button>`}).join(''):'<div class="empty">Aucune quête quotidienne. Coche « Quotidienne » dans une activité pour en créer.</div>'}</div></section>
  <section class="section"><h2>Activités</h2>
    <div class="list">${others.map(a=>`<button class="item" data-act="log" data-id="${a.id}"><span class="ico" aria-hidden="true">${statIcon(a.stat)}</span>
      <span class="grow"><span class="t">${esc(a.name)}</span><br><span class="s num">${a.stat?esc(a.stat)+' · ':''}+${a.xp} XP${a.gold?` · +${a.gold} or`:''}</span></span><span class="pill">Ajouter</span></button>`).join('')||'<div class="empty">Aucune activité active.</div>'}</div></section>`;
}

function viewJournal(){
  const rows=[...S.journal].sort((a,b)=>b.day.localeCompare(a.day)||String(b.created_at||b.id).localeCompare(String(a.created_at||a.id)));
  if(!rows.length) return `<header class="top"><h1>Journal</h1></header><div class="empty">Rien dans le journal. Valide une activité depuis « Aujourd'hui ».</div>`;
  let html=`<header class="top"><h1>Journal</h1></header>`, cur='';
  for(const e of rows){
    if(e.day!==cur){ if(cur) html+='</div>'; cur=e.day; html+=`<div class="list"><div class="day-h">${esc(fmtDay(e.day))}</div>`; }
    const c=S.confirmDel===e.id;
    html+=`<div class="item"><span class="ico" aria-hidden="true">${statIcon(e.stat)}</span><span class="grow"><span class="t">${esc(e.activity)}${e.qty>1?` ×${e.qty}`:''}</span><br>
      <span class="s num">+${e.xp+(e.bonus_xp||0)} XP${e.gold?` · +${e.gold} or`:''}${e.bonus_xp>1?` · série ${e.bonus_xp}`:''}</span></span>
      <button class="del ${c?'confirm':''}" data-act="deluse" data-id="${e.id}" aria-label="Supprimer">${c?'Confirmer':'Retirer'}</button></div>`;
  }
  return html+'</div>';
}

function radar(st){
  const frac=s=>{const xp=st[s.n],l=lvl(xp);return l+(xp-minXp(l))/(minXp(l+1)-minXp(l));};
  const cx=150,cy=140,R=88, max=Math.max(2,Math.ceil(Math.max(...STATS.map(frac))+0.5));
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/6; return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const ring=f=>STATS.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ');
  const vals=STATS.map((s,i)=>{const xp=st[s.n],l=lvl(xp),min=minXp(l),nx=minXp(l+1); return pt(i,R*Math.min(1,(l+(xp-min)/(nx-min))/max));});
  return `<svg class="radar" viewBox="0 0 300 290" role="img" aria-label="Radar des six statistiques">
    ${[1/3,2/3,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('')}
    ${STATS.map((_,i)=>{const p=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`}).join('')}
    <polygon points="${vals.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="var(--xp)" fill-opacity=".28" stroke="var(--xp)" stroke-width="2.5" stroke-linejoin="round"/>
    ${STATS.map((s,i)=>{const p=pt(i,R+26);return `<text x="${p[0].toFixed(1)}" y="${(p[1]+6).toFixed(1)}" text-anchor="middle" font-size="20">${s.i}</text>`}).join('')}
    <text x="${cx+4}" y="${cy-R-4}" font-size="11" font-weight="600">niv ${max}</text></svg>`;
}
function viewHero(){
  const t=totals(), L=lvlInfo(t.xp);
  return `<header class="top"><div><h1>${esc(S.user.name)}</h1><div class="date">Niveau ${L.l} · ${t.xp} XP · ${t.gold} or</div></div></header>
  <section class="card">${radar(t.st)}</section>
  <section class="card" aria-label="Statistiques">${STATS.map(s=>{const xp=t.st[s.n],I=lvlInfo(xp);
    return `<div class="statrow"><span style="font-size:22px;text-align:center" aria-hidden="true">${s.i}</span><span class="n">${s.n}</span><span class="num muted">Niv ${I.l} · ${xp-I.min}/${I.next-I.min}</span>
      <div class="bar"><i style="width:${I.pct*100}%"></i></div></div>`}).join('')}</section>`;
}

function viewGuild(){
  const key=S.boardMode==='week'?'week_xp':'xp';
  const rows=[...S.board].sort((a,b)=>(b[key]||0)-(a[key]||0));
  return `<header class="top"><h1>Joueurs</h1></header>
  <div class="seg" role="group" aria-label="Période"><button data-act="board" data-m="week" aria-pressed="${S.boardMode==='week'}">7 derniers jours</button><button data-act="board" data-m="all" aria-pressed="${S.boardMode==='all'}">Total</button></div>
  <div class="list">${rows.map((r,i)=>`<div class="item ${r.id===S.user.id?'me':''}"><span class="rank num">${i+1}</span>
    <span class="grow"><span class="t">${esc(r.name)}</span><br><span class="s num">Niveau ${lvl(r.xp)} · ${r.xp} XP au total</span></span>
    <span class="pill num">+${r[key]||0} XP</span></div>`).join('')||'<div class="empty">Personne pour l\'instant.</div>'}</div>`;
}

function viewActs(){
  const list=[...S.activities].sort((a,b)=>(b.active-a.active)||a.name.localeCompare(b.name,'fr'));
  return `<header class="top"><h1>Activités</h1></header>
  <button class="btn" data-act="newact">Nouvelle activité</button>
  <div class="list">${list.map(a=>`<button class="item" data-act="editact" data-id="${a.id}" style="${a.active?'':'opacity:.55'}"><span class="ico" aria-hidden="true">${statIcon(a.stat)}</span>
    <span class="grow"><span class="t">${esc(a.name)}</span><br><span class="s num">+${a.xp} XP · +${a.gold} or${a.stat?` · ${a.stat_xp} pts ${esc(a.stat)}`:''}</span></span>
    ${a.daily?'<span class="pill">Quotidienne</span>':''}${a.active?'':'<span class="pill gold">Masquée</span>'}</button>`).join('')}</div>
  <section class="section"><h2>Données</h2>
    ${!S.journal.length&&SEED_HISTORY.length?'<button class="btn ghost" data-act="import">Importer l\'historique de mon Google Sheet</button>':''}
    <button class="btn ghost" data-act="signout">Se déconnecter</button>
    <p class="muted" style="font-size:13px;margin:0">Les gains d'un jour passé restent fixés tels qu'ils étaient quand tu les as validés, même si tu modifies l'activité ensuite.</p></section>`;
}

function viewAuth(){
  const a=S.auth, up=a.mode==='up';
  return `<form class="auth" id="authform"><div><div class="eyebrow">Life RPG</div><h1>${up?'Rejoindre la partie':'Reprendre l\'aventure'}</h1></div>
    ${up?'<label class="f" for="a-name">Pseudo<input class="inp" id="a-name" autocomplete="nickname" required maxlength="24"></label>':''}
    <label class="f" for="a-mail">E-mail<input class="inp" id="a-mail" type="email" autocomplete="email" required></label>
    <label class="f" for="a-pw">Mot de passe (6 caractères minimum)<input class="inp" id="a-pw" type="password" autocomplete="${up?'new-password':'current-password'}" minlength="6" required></label>
    ${a.err?`<div class="err" role="alert">${esc(a.err)}</div>`:''}${a.info?`<div class="ok-msg">${esc(a.info)}</div>`:''}
    <button class="btn" type="submit" ${a.busy?'disabled':''}>${up?'Créer mon compte':'Me connecter'}</button>
    <button class="btn ghost" type="button" data-act="authmode">${up?'J\'ai déjà un compte':'Créer un compte'}</button></form>`;
}

function sheetHTML(){
  const sh=S.sheet; if(!sh) return '';
  let inner='';
  if(sh.type==='log'){
    const a=S.activities.find(x=>x.id===sh.id); if(!a) return '';
    inner=`<h2>${esc(a.name)}</h2>
      <div class="stepper"><button data-act="qty" data-d="-1" aria-label="Moins">−</button><output class="num" aria-live="polite">${sh.qty}</output><button data-act="qty" data-d="1" aria-label="Plus">+</button></div>
      <div class="reward num"><span class="pill">+${a.xp*sh.qty} XP</span>${a.gold?`<span class="pill gold">+${a.gold*sh.qty} or</span>`:''}${a.stat?`<span class="pill">+${a.stat_xp*sh.qty} pts ${esc(a.stat)}</span>`:''}</div>
      <label class="f" for="s-day">Date<input class="inp" id="s-day" type="date" value="${sh.day}" max="${today()}"></label>
      <button class="btn" data-act="confirmlog">Valider</button><button class="btn ghost" data-act="close">Annuler</button>`;
  } else if(sh.type==='edit'){
    const a=sh.draft;
    inner=`<h2>${a.id?'Modifier l\'activité':'Nouvelle activité'}</h2>
      <label class="f" for="e-name">Nom<input class="inp" id="e-name" value="${esc(a.name)}" maxlength="60"></label>
      <label class="f" for="e-stat">Statistique<select class="inp" id="e-stat"><option value="">Aucune</option>${STATS.map(s=>`<option ${a.stat===s.n?'selected':''}>${s.n}</option>`).join('')}</select></label>
      <div class="grid2"><label class="f" for="e-xp">XP<input class="inp num" id="e-xp" type="number" inputmode="numeric" min="0" value="${a.xp}"></label>
      <label class="f" for="e-gold">Or<input class="inp num" id="e-gold" type="number" inputmode="numeric" min="0" value="${a.gold}"></label>
      <label class="f" for="e-sxp">Pts stat<input class="inp num" id="e-sxp" type="number" inputmode="numeric" min="0" value="${a.stat_xp}"></label></div>
      <label class="f" for="e-skill">Compétence<input class="inp" id="e-skill" value="${esc(a.skill||'')}" maxlength="40"></label>
      <label class="tog" for="e-daily"><input type="checkbox" id="e-daily" ${a.daily?'checked':''}>Quête quotidienne (avec série)</label>
      <label class="tog" for="e-active"><input type="checkbox" id="e-active" ${a.active?'checked':''}>Active</label>
      <div class="err" id="e-err" role="alert"></div>
      <button class="btn" data-act="saveact">Enregistrer</button>
      ${a.id?`<button class="btn danger ${S.confirmDel===a.id?'confirm':''}" data-act="delact">${S.confirmDel===a.id?'Confirmer la suppression':'Supprimer'}</button>`:''}
      <button class="btn ghost" data-act="close">Annuler</button>`;
  }
  return `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in">${inner}</div></div>`;
}

function render(){
  const app=$('#app');
  if(S.loading){ app.innerHTML='<div class="empty">Chargement…</div>'; $('#tabs').hidden=true; return; }
  if(S.cloud&&!S.user){ app.innerHTML=viewAuth(); $('#tabs').hidden=true; $('#layer').innerHTML=''; return; }
  $('#tabs').hidden=false;
  const v={today:viewToday,journal:viewJournal,hero:viewHero,guild:viewGuild,acts:viewActs}[S.tab];
  app.innerHTML=v();
  $('#tabs-in').innerHTML=TABS.map(([k,l])=>`<button class="tab" data-act="tab" data-tab="${k}" ${S.tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>${l}</button>`).join('');
  $('#layer').innerHTML=sheetHTML();
}

/* ===== Événements ===== */
document.addEventListener('click', async ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id, A=()=>S.activities.find(x=>x.id===id);
  if(act==='tab'){ S.tab=el.dataset.tab; S.confirmDel=null; window.scrollTo(0,0); render(); }
  else if(act==='quest'){ const a=A(); if(a&&!doneToday(a)) logActivity(a,1,today()); }
  else if(act==='log'){ S.sheet={type:'log',id,qty:1,day:today()}; render(); }
  else if(act==='qty'){ S.sheet.qty=Math.min(50,Math.max(1,S.sheet.qty+Number(el.dataset.d))); render(); }
  else if(act==='confirmlog'){ const a=S.activities.find(x=>x.id===S.sheet.id); const day=($('#s-day')||{}).value||today(); const q=S.sheet.qty; S.sheet=null; if(a) logActivity(a,q,day>today()?today():day); }
  else if(act==='close'){ S.sheet=null; S.confirmDel=null; render(); }
  else if(act==='deluse'){ if(S.confirmDel===id){ S.confirmDel=null; try{ await Store.delEntry(id); if(S.cloud) Store.loadBoard().catch(()=>{}); }catch(e){ toast('Erreur : '+e.message);} } else S.confirmDel=id; render(); }
  else if(act==='board'){ S.boardMode=el.dataset.m; render(); }
  else if(act==='newact'){ S.sheet={type:'edit',draft:{name:'',stat:'',xp:10,gold:1,skill:'',stat_xp:10,daily:false,active:true}}; render(); }
  else if(act==='editact'){ S.sheet={type:'edit',draft:{...A()}}; render(); }
  else if(act==='saveact'){
    const d=S.sheet.draft, name=$('#e-name').value.trim(); if(!name){ $('#e-err').textContent='Donne un nom à l\'activité.'; return; }
    const n=i=>Math.max(0,parseInt($(i).value,10)||0);
    const a={...d,name,stat:$('#e-stat').value||null,xp:n('#e-xp'),gold:n('#e-gold'),stat_xp:n('#e-sxp'),skill:$('#e-skill').value.trim(),daily:$('#e-daily').checked,active:$('#e-active').checked};
    try{ await Store.saveActivity(a); S.sheet=null; render(); toast('Activité enregistrée'); }catch(e){ $('#e-err').textContent=e.message; }
  }
  else if(act==='delact'){ if(S.confirmDel===S.sheet.draft.id){ try{ await Store.delActivity(S.sheet.draft.id); }catch(e){ toast(e.message);} S.sheet=null; S.confirmDel=null; } else S.confirmDel=S.sheet.draft.id; render(); }
  else if(act==='import'){ try{ await Store.importHistory(); await Store.loadBoard(); toast('Historique importé'); }catch(e){ toast('Erreur : '+e.message);} render(); }
  else if(act==='signout'){ await sb.auth.signOut(); S.user=null; S.journal=[]; S.activities=[]; render(); }
  else if(act==='authmode'){ S.auth={mode:S.auth.mode==='in'?'up':'in',err:'',info:'',busy:false}; render(); }
});
document.addEventListener('change',ev=>{ if(ev.target.id==='s-day'&&S.sheet) S.sheet.day=ev.target.value; });
document.addEventListener('submit', async ev=>{
  if(ev.target.id!=='authform') return; ev.preventDefault();
  const up=S.auth.mode==='up', email=$('#a-mail').value.trim(), pw=$('#a-pw').value, name=up?$('#a-name').value.trim():'';
  S.auth.busy=true; S.auth.err=''; S.auth.info='';
  try{
    if(up){ const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{name}}}); if(error) throw error;
      if(!data.session){ S.auth={mode:'in',err:'',info:'Compte créé. Confirme ton e-mail puis connecte-toi.',busy:false}; render(); return; } }
    else { const {error}=await sb.auth.signInWithPassword({email,password:pw}); if(error) throw error; }
    S.loading=true; render(); await Store.loadCloud(); S.loading=false; render();
  }catch(e){ S.loading=false; S.auth.busy=false;
    S.auth.err=/Invalid login/i.test(e.message)?'E-mail ou mot de passe incorrect.':/already/i.test(e.message)?'Cet e-mail a déjà un compte.':e.message; render(); }
});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&S.cloud&&S.user) Store.loadBoard().then(render).catch(()=>{}); });

/* ===== Démarrage ===== */
(async function boot(){
  CONFIG.SUPABASE_URL=CONFIG.SUPABASE_URL.trim().replace(/\/(rest|auth)\/v1\/?$/,'').replace(/\/+$/,'');
  S.cloud=true;
  try{
    if(!window.supabase) throw new Error('le service est injoignable, vérifie ta connexion.');
    sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY); await Store.loadCloud();
  }catch(e){ console.error(e); S.auth.err='Connexion impossible : '+(e.message||e); }
  S.loading=false; render();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
